<script>
// ==================== 核心變數 ====================
let fullMap = null, userMarker = null;
let currentMode = 'map'; 
let isMapFollowingUser = true;

// Three.js AR 箭頭系統
let scene, camera, renderer;
let chevronPool = [], leftRailLine = null, rightRailLine = null;
let turnPortalSign = null, portalCanvas = null, portalTexture = null;
const NUM_ARROWS = 14;
let animationPhase = 0, lastFrameTime = performance.now(), conveyorOffsetMeters = 0;

// 定位與路線參數
let userLat = 25.0645, userLon = 121.4552;
let currentSpeedKmh = 0, currentGForce = 0.0;
let smoothedYawRad = 0, hasInitializedYaw = false, headingOffsetRad = 0;
let isSimulatingDrive = false, simTimer = null, simWaypointIndex = 0;

let activeWaypoints = [], routeSteps = [], passedStepIndex = 0, totalRouteDistanceMeters = 0, targetDest = null;
let toastTimer = null;

// ==================== UI 工具 ====================
function showToast(msg, isWarning = false) {
    const toast = document.getElementById('hud-toast');
    toast.innerText = msg;
    toast.className = isWarning ? 'toast-show toast-warn' : 'toast-show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
}

function lockInputAgainstVibration() {
    const input = document.getElementById('dest-input');
    if (input) { input.blur(); input.setAttribute('readonly', 'readonly'); }
}

// ==================== 1. 初始化系統與權限 ====================
async function initSystem(mode) {
    currentMode = mode;
    try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
        }
        window.addEventListener('deviceorientation', handleOrientation, true);
        window.addEventListener('devicemotion', handleDeviceMotion, true); // 修復點：確保函式存在
        if ('geolocation' in navigator) navigator.geolocation.watchPosition(handleGPS, () => {}, { enableHighAccuracy: true });

        initFullVectorMap();
        initThreeJS();

        applyDisplayMode(currentMode);
        document.getElementById('start-overlay').style.display = 'none';
        lockInputAgainstVibration();
        showToast('✅ 系統啟動成功，支援雙 WebGL 渲染');
    } catch (err) {
        showToast('權限提示: ' + err.message, true);
    }
}

function cycleDisplayMode() {
    if (currentMode === 'map') currentMode = 'hud';
    else if (currentMode === 'hud') currentMode = 'ar';
    else currentMode = 'map';
    applyDisplayMode(currentMode);
}

async function applyDisplayMode(mode) {
    const mapDiv = document.getElementById('full-vector-map');
    const video = document.getElementById('camera-video');
    const modeBtn = document.getElementById('mode-btn');

    if (mode === 'map') {
        mapDiv.style.display = 'block'; video.style.display = 'none';
        if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
        modeBtn.innerText = '🍎 3D地圖'; modeBtn.className = 'apple-pill-btn apple-btn-mode';
        if (fullMap) fullMap.resize();
        showToast('🍎 Apple 3D 地圖 + AR箭頭');
    } else if (mode === 'hud') {
        mapDiv.style.display = 'none'; video.style.display = 'none';
        if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
        modeBtn.innerText = '🌙 HUD純黑'; modeBtn.className = 'apple-pill-btn';
        showToast('🌙 HUD 純黑抬頭模式');
    } else if (mode === 'ar') {
        mapDiv.style.display = 'none';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
            video.srcObject = stream; video.play(); video.style.display = 'block';
            modeBtn.innerText = '📹 AR實景'; modeBtn.className = 'apple-pill-btn';
            showToast('📹 AR 相機透視模式');
        } catch (e) { showToast('相機失敗，切回地圖', true); applyDisplayMode('map'); }
    }
}

// ==================== 2. MapLibre GL 3D 地圖 ====================
function initFullVectorMap() {
    fullMap = new maplibregl.Map({
        container: 'full-vector-map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [userLon, userLat],
        zoom: 16.8, pitch: 62, bearing: 0,
        antialias: false
    });

    const puckEl = document.createElement('div');
    puckEl.className = 'apple-car-puck';
    puckEl.innerHTML = `<div class="puck-cone-beam"></div><div class="puck-core-dot"></div>`;
    userMarker = new maplibregl.Marker({ element: puckEl, rotationAlignment: 'map', pitchAlignment: 'map' })
        .setLngLat([userLon, userLat]).addTo(fullMap);

    fullMap.on('load', () => {
        const layers = fullMap.getStyle().layers;
        let labelLayerId = layers.find(l => l.type === 'symbol' && l.layout && l.layout['text-field'])?.id;
        const sourceName = Object.keys(fullMap.getStyle().sources)[0] || 'carto';

        fullMap.addLayer({
            'id': '3d-buildings-extrusion',
            'source': sourceName,
            'source-layer': 'building',
            'type': 'fill-extrusion',
            'minzoom': 14.5,
            'paint': {
                'fill-extrusion-color': ['interpolate', ['linear'], ['get', 'render_height'], 0, '#212836', 40, '#354157'],
                'fill-extrusion-height': ['coalesce', ['get', 'render_height'], ['get', 'height'], 15],
                'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
                'fill-extrusion-opacity': 0.88
            }
        }, labelLayerId);

        fullMap.addSource('route', { 'type': 'geojson', 'data': { 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': [] } } });
        fullMap.addLayer({ 'id': 'route-casing', 'type': 'line', 'source': 'route', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#004bb5', 'line-width': 10, 'line-opacity': 0.8 } }, labelLayerId);
        fullMap.addLayer({ 'id': 'route-line', 'type': 'line', 'source': 'route', 'layout': { 'line-join': 'round', 'line-cap': 'round' }, 'paint': { 'line-color': '#0A84FF', 'line-width': 6, 'line-opacity': 1.0 } }, labelLayerId);
    });

    fullMap.on('dragstart', () => { isMapFollowingUser = false; });
    fullMap.on('click', (e) => {
        document.getElementById('dest-input').value = `${e.lngLat.lat.toFixed(5)},${e.lngLat.lng.toFixed(5)}`;
        executeRouteByCoords(e.lngLat.lat, e.lngLat.lng, '地圖指定點');
    });
}

// ==================== 3. Three.js AR 賽車箭頭重構 ====================
function initThreeJS() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(0, 2.8, 0); camera.rotation.order = 'YXZ'; camera.rotation.x = THREE.MathUtils.degToRad(-20);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('ar-canvas'), alpha: true, antialias: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

    const shape = new THREE.Shape();
    shape.moveTo(0, 1.15); shape.lineTo(1.10, -0.35); shape.lineTo(0.72, -0.75); shape.lineTo(0, 0.22); shape.lineTo(-0.72, -0.75); shape.lineTo(-1.10, -0.35); shape.closePath();
    const extrudeGeo = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: 0.08, bevelEnabled: false });
    extrudeGeo.rotateX(-Math.PI / 2 + THREE.MathUtils.degToRad(16));

    for (let i = 0; i < NUM_ARROWS; i++) {
        const group = new THREE.Group();
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, transparent: true, opacity: 0.92 });
        group.add(new THREE.Mesh(extrudeGeo, coreMat));
        group.userData = { coreMat, baseX: 0, baseZ: 0, nextX: 0, nextZ: 0 };
        scene.add(group); chevronPool.push(group);
    }

    const railMat = new THREE.LineBasicMaterial({ color: 0x00ffff, transparent: true, opacity: 0.65 });
    leftRailLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new Array(NUM_ARROWS).fill(new THREE.Vector3())), railMat);
    rightRailLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(new Array(NUM_ARROWS).fill(new THREE.Vector3())), railMat);
    scene.add(leftRailLine); scene.add(rightRailLine);

    portalCanvas = document.createElement('canvas'); portalCanvas.width = 512; portalCanvas.height = 256;
    portalTexture = new THREE.CanvasTexture(portalCanvas);
    updatePortalSignTexture('➡️', '前方路口');

    turnPortalSign = new THREE.Group();
    turnPortalSign.add(new THREE.Mesh(new THREE.PlaneGeometry(4.6, 2.3), new THREE.MeshBasicMaterial({ map: portalTexture, transparent: true, side: THREE.DoubleSide })));
    const pillarMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 2.4, 8), new THREE.MeshBasicMaterial({ color: 0x00ffcc, transparent: true, opacity: 0.75 })); pillarMesh.position.y = -2.2;
    turnPortalSign.add(pillarMesh); turnPortalSign.visible = false; scene.add(turnPortalSign);

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (fullMap) fullMap.resize();
    });
    requestAnimationFrame(animateLoop);
}

function recalculateForwardGuidanceRibbon() {
    if (activeWaypoints.length === 0) return;
    const myHeadingRad = smoothedYawRad + headingOffsetRad;
    let nearestIdx = 0, minDist = Infinity, nearestENU = { east: 0, north: 0 };
    
    for (let i = 0; i < activeWaypoints.length; i++) {
        const enu = latLonToENU(activeWaypoints[i].lat, activeWaypoints[i].lon, userLat, userLon);
        const d = Math.hypot(enu.east, enu.north);
        if (d < minDist) { minDist = d; nearestIdx = i; nearestENU = enu; }
    }

    const baseWp = activeWaypoints[nearestIdx];
    const rawHeadingError = normalizeAngleRad(baseWp.headingRad - myHeadingRad);
    const clampedHeadingError = Math.max(-0.78, Math.min(0.78, rawHeadingError));
    const crossTrackError = nearestENU.east * Math.cos(myHeadingRad) - nearestENU.north * Math.sin(myHeadingRad);
    
    let curX = Math.max(-1.6, Math.min(1.6, crossTrackError * 0.45));
    let curZ = -3.8;
    const dynamicStepLen = Math.min(4.2, 2.5 + (currentSpeedKmh / 60) * 1.5);
    const ribbonNodes = [];

    for (let i = 0; i < NUM_ARROWS; i++) {
        const wpIdx = Math.min(nearestIdx + i, activeWaypoints.length - 1);
        const roadRelativeTurn = normalizeAngleRad(activeWaypoints[wpIdx].headingRad - baseWp.headingRad);
        const visualYaw = Math.max(-1.08, Math.min(1.08, clampedHeadingError * Math.pow(1 - i / (NUM_ARROWS - 1), 1.5) + roadRelativeTurn));
        let sharpness = activeWaypoints[wpIdx].roadSharpness || 0;
        
        curX *= 0.88; ribbonNodes.push({ x: curX, z: curZ, yaw: visualYaw, sharpness });
        curX += Math.sin(visualYaw) * dynamicStepLen; curZ -= Math.cos(visualYaw) * dynamicStepLen;
    }
    applyNodesTo3DScene(ribbonNodes);
}

function applyNodesTo3DScene(nodes) {
    const leftPts = [], rightPts = [];
    let maxSharpness = 0, sharpestNode = null;

    for (let i = 0; i < NUM_ARROWS; i++) {
        const node = nodes[i], group = chevronPool[i];
        if (node.sharpness > maxSharpness) { maxSharpness = node.sharpness; if (i >= 4) sharpestNode = node; }
        
        group.userData.coreMat.color.setRGB(Math.min(1.0, node.sharpness * 2.2), Math.max(0.08, 1.0 - node.sharpness * 1.15), Math.max(0.0, 0.45 - node.sharpness * 1.5));
        
        group.userData.baseX = node.x; group.userData.baseZ = node.z;
        group.userData.nextX = i > 0 ? nodes[i - 1].x : node.x; group.userData.nextZ = i > 0 ? nodes[i - 1].z : node.z + 2.5;
        
        group.position.set(node.x, 0, node.z); group.rotation.y = -node.yaw; group.visible = true;
        
        const cosY = Math.cos(node.yaw), sinY = Math.sin(node.yaw), rw = 1.25;
        leftPts.push(new THREE.Vector3(node.x - cosY * rw, 0.05, node.z + sinY * rw)); rightPts.push(new THREE.Vector3(node.x + cosY * rw, 0.05, node.z - sinY * rw));
    }
    
    if (leftRailLine) { leftRailLine.geometry.setFromPoints(leftPts); leftRailLine.visible = true; }
    if (rightRailLine) { rightRailLine.geometry.setFromPoints(rightPts); rightRailLine.visible = true; }
    
    if (turnPortalSign) {
        if (sharpestNode && maxSharpness > 0.55) { 
            turnPortalSign.position.set(sharpestNode.x, 2.5, sharpestNode.z); turnPortalSign.visible = true; 
            document.getElementById('edge-glow-layer').className = sharpestNode.x >= 0 ? 'glow-right' : 'glow-left'; 
        } else { turnPortalSign.visible = false; document.getElementById('edge-glow-layer').className = ''; }
    }
    document.getElementById('apex-alert').style.display = maxSharpness > 0.55 ? 'block' : 'none';
}

function animateLoop(timestamp) {
    requestAnimationFrame(animateLoop);
    const dt = Math.min(0.1, (timestamp - lastFrameTime) / 1000); lastFrameTime = timestamp;
    animationPhase = timestamp * (0.008 + (currentSpeedKmh / 100) * 0.008);
    conveyorOffsetMeters = (conveyorOffsetMeters + (currentSpeedKmh / 3.6) * dt * 0.35) % 1.0;

    for (let i = 0; i < NUM_ARROWS; i++) {
        const group = chevronPool[i]; if (!group.visible) continue;
        const wave = (Math.sin(animationPhase - i * 0.6) + 1.0) * 0.5;
        group.scale.set(0.92 + wave * 0.20, 1.0, 0.92 + wave * 0.20);
        
        if (currentSpeedKmh > 2) {
            group.position.set(group.userData.baseX + (group.userData.nextX - group.userData.baseX) * conveyorOffsetMeters, wave * 0.07, group.userData.baseZ + (group.userData.nextZ - group.userData.baseZ) * conveyorOffsetMeters);
        } else { group.position.y = wave * 0.07; }
        
        group.userData.coreMat.opacity = 0.68 + wave * 0.32;
    }
    if (turnPortalSign && turnPortalSign.visible) turnPortalSign.position.y = 2.45 + Math.sin(timestamp * 0.004) * 0.15;
    renderer.render(scene, camera);
}

// ==================== 5. 導航路線解析與 OSRM API ====================
async function planRoute() {
    const val = document.getElementById('dest-input').value.trim();
    if (!val) { showToast('⚠️ 請貼上地址或點選地圖', true); return; }
    lockInputAgainstVibration(); executeRouteByCoords(0, 0, val);
}

async function executeRouteByCoords(destLat, destLon, labelName) {
    showToast(`🔍 正在為您規劃前往「${labelName.slice(0,8)}」...`);
    let finalLat = destLat || 25.0610, finalLon = destLon || 121.4580;
    targetDest = { lat: finalLat, lon: finalLon, name: labelName };

    try {
        const query = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${finalLon},${finalLat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(query); const data = await res.json();

        if (data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            totalRouteDistanceMeters = route.distance;
            const rawCoords = route.geometry.coordinates.map(c => ({ lon: c[0], lat: c[1] }));
            
            activeWaypoints = resampleAndAnalyzeCurve(rawCoords, 3.2);
            
            if (fullMap && fullMap.getSource('route')) {
                fullMap.getSource('route').setData({ 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': route.geometry.coordinates } });
                const bounds = new maplibregl.LngLatBounds(); route.geometry.coordinates.forEach(c => bounds.extend(c));
                fullMap.fitBounds(bounds, { padding: 40, pitch: 62 });
            }

            document.getElementById('search-panel').style.display = 'none';
            document.getElementById('apple-turn-banner').style.display = 'block';
            document.getElementById('apple-bottom-dock').style.display = 'flex';

            updateAppleUI(totalRouteDistanceMeters, route.duration, labelName, '順著藍色導航線前進');
            setTimeout(() => { isMapFollowingUser = true; }, 3000);
            showToast(`✅ 路線載入完成！全長 ${(totalRouteDistanceMeters/1000).toFixed(1)} km`);
        }
    } catch (e) { showToast('路線解析失敗，請重新嘗試', true); }
}

function resampleAndAnalyzeCurve(coords, spacingMeters) {
    if (coords.length < 2) return []; const pts = [];
    for (let i = 0; i < coords.length - 1; i++) {
        const enu = latLonToENU(coords[i+1].lat, coords[i+1].lon, coords[i].lat, coords[i].lon);
        const steps = Math.max(1, Math.floor(Math.hypot(enu.east, enu.north) / spacingMeters));
        for (let s = 0; s < steps; s++) pts.push({ lat: coords[i].lat + (coords[i+1].lat - coords[i].lat) * (s / steps), lon: coords[i].lon + (coords[i+1].lon - coords[i].lon) * (s / steps) });
    }
    pts.push(coords[coords.length - 1]);
    const result = [];
    for (let i = 0; i < pts.length; i++) {
        const enuNext = latLonToENU(pts[Math.min(i + 1, pts.length - 1)].lat, pts[Math.min(i + 1, pts.length - 1)].lon, pts[i].lat, pts[i].lon);
        result.push({ lat: pts[i].lat, lon: pts[i].lon, headingRad: (enuNext.east === 0 && enuNext.north === 0 && result.length > 0) ? result[result.length - 1].headingRad : Math.atan2(enuNext.east, enuNext.north), roadSharpness: 0 });
    }
    for (let i = 0; i < result.length; i++) {
        let maxDiff = 0;
        for (let look = 1; look <= 4; look++) { const diff = Math.abs(normalizeAngleRad(result[Math.min(i + look, result.length - 1)].headingRad - result[i].headingRad)); if (diff > maxDiff) maxDiff = diff; }
        result[i].roadSharpness = Math.min(1.0, maxDiff / THREE.MathUtils.degToRad(35));
    }
    return result;
}

// ==================== 6. 感測器與模擬巡航 ====================
function handleOrientation(event) {
    if (isSimulatingDrive) return;
    let rawHeading = event.webkitCompassHeading !== undefined ? event.webkitCompassHeading : (360 - (event.alpha || 0));
    const targetYawRad = THREE.MathUtils.degToRad(rawHeading);

    if (!hasInitializedYaw) { smoothedYawRad = targetYawRad; hasInitializedYaw = true; }
    else {
        const delta = Math.atan2(Math.sin(targetYawRad - smoothedYawRad), Math.cos(targetYawRad - smoothedYawRad));
        if (Math.abs(delta) > 0.02) smoothedYawRad += delta * 0.16;
    }
    updateHeadingUI();
}

function handleGPS(pos) {
    if (isSimulatingDrive) return;
    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
    currentSpeedKmh = pos.coords.speed ? Math.max(0, Math.round(pos.coords.speed * 3.6)) : 0;
    document.getElementById('speed-val').innerText = currentSpeedKmh;

    if (userMarker) userMarker.setLngLat([userLon, userLat]);
    if (isMapFollowingUser && fullMap) fullMap.jumpTo({ center: [userLon, userLat] });
    if (activeWaypoints.length > 0) recalculateForwardGuidanceRibbon();
}

// ==================== 修復點：加入缺失的 handleDeviceMotion 函式 ====================
function handleDeviceMotion(event) {
    const acc = event.acceleration;
    if (!acc || acc.x === null) return;
    const rawG = Math.hypot(acc.x || 0, acc.y || 0, acc.z || 0) / 9.81;
    currentGForce = currentGForce * 0.88 + rawG * 0.12;
}

function updateHeadingUI() {
    const displayHdg = Math.round((THREE.MathUtils.radToDeg(smoothedYawRad + headingOffsetRad) + 360) % 360);
    if (userMarker) userMarker.setRotation(displayHdg);
    if (isMapFollowingUser && fullMap && currentMode === 'map') fullMap.jumpTo({ bearing: displayHdg });
    if (activeWaypoints.length > 0) recalculateForwardGuidanceRibbon();
}

function startSimulationDrive() {
    if (activeWaypoints.length < 2) {
        showToast('⚠️ 請先點選地圖規劃路線，再啟動巡航', true); return;
    }
    isSimulatingDrive = true; simWaypointIndex = 0;
    document.getElementById('sim-btn').innerText = '⏹ 停止模擬'; document.getElementById('sim-btn').style.color = '#fbbf24';
    
    simTimer = setInterval(() => {
        if (simWaypointIndex >= activeWaypoints.length - 1) { stopSimulationDrive(); return; }
        const wp = activeWaypoints[simWaypointIndex];
        userLat = wp.lat; userLon = wp.lon; smoothedYawRad = wp.headingRad;
        currentSpeedKmh = wp.roadSharpness > 0.5 ? 28 : 55;
        document.getElementById('speed-val').innerText = currentSpeedKmh;

        updateHeadingUI();
        if (userMarker) userMarker.setLngLat([userLon, userLat]);
        if (isMapFollowingUser && fullMap) fullMap.jumpTo({ center: [userLon, userLat] });
        recalculateForwardGuidanceRibbon();
        
        simWaypointIndex++;
    }, 280);
    showToast('🏎️ 已啟動 3D 模擬巡航');
}

function stopSimulationDrive() {
    isSimulatingDrive = false; if (simTimer) { clearInterval(simTimer); simTimer = null; }
    currentSpeedKmh = 0; document.getElementById('speed-val').innerText = 0;
    document.getElementById('sim-btn').innerText = '模擬巡航'; document.getElementById('sim-btn').style.color = '#000';
}

function stopNavigation() {
    stopSimulationDrive(); activeWaypoints = [];
    if (fullMap && fullMap.getSource('route')) fullMap.getSource('route').setData({ 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': [] } });
    chevronPool.forEach(g => g.visible = false); if (leftRailLine) leftRailLine.visible = false; if (rightRailLine) rightRailLine.visible = false;
    document.getElementById('apple-turn-banner').style.display = 'none'; document.getElementById('apple-bottom-dock').style.display = 'none';
    document.getElementById('search-panel').style.display = 'flex';
}

// 數學與 UI 更新共用
function latLonToENU(lat, lon, refLat, refLon) { const R = 6378137.0; return { east: (lon - refLon) * Math.PI / 180.0 * R * Math.cos(refLat * Math.PI / 180.0), north: (lat - refLat) * Math.PI / 180.0 * R }; }
function normalizeAngleRad(angle) { return Math.atan2(Math.sin(angle), Math.cos(angle)); }
function recenterMapToUser() { isMapFollowingUser = true; if (fullMap) fullMap.flyTo({ center: [userLon, userLat], zoom: 17, pitch: 62, essential: true }); showToast('🎯 視角已重新對齊自車位置'); }

let lastPortalTextKey = '';
function updatePortalSignTexture(arrowChar, streetText) {
    if (!portalCanvas || !portalTexture) return;
    const key = arrowChar + '_' + streetText; if (key === lastPortalTextKey) return; lastPortalTextKey = key;
    const ctx = portalCanvas.getContext('2d'); ctx.clearRect(0, 0, 512, 256);
    ctx.fillStyle = 'rgba(8, 14, 24, 0.88)'; ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.roundRect(12, 12, 488, 232, 28); ctx.fill(); ctx.stroke();
    ctx.font = 'bold 92px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#00ffcc'; ctx.fillText(arrowChar, 110, 128);
    ctx.fillStyle = '#ffffff'; ctx.font = '900 44px sans-serif'; ctx.textAlign = 'left'; ctx.fillText((streetText || '準備轉彎').slice(0, 8), 185, 105);
    ctx.fillStyle = '#ffea00'; ctx.font = 'bold 30px monospace'; ctx.fillText('⚡ 減速入彎 APEX', 185, 168);
    portalTexture.needsUpdate = true;
}

function updateAppleUI(remMeters, remSeconds, mainStreet, subStreet) {
    const now = new Date(); const etaDate = new Date(now.getTime() + remSeconds * 1000);
    document.getElementById('eta-time-val').innerText = `${String(etaDate.getHours()).padStart(2, '0')}:${String(etaDate.getMinutes()).padStart(2, '0')}`;
    document.getElementById('eta-min-val').innerText = Math.max(1, Math.round(remSeconds / 60));
    document.getElementById('eta-km-val').innerText = (remMeters / 1000).toFixed(1);
    document.getElementById('turn-main-street').innerText = mainStreet; document.getElementById('turn-sub-street').innerText = subStreet;
}
</script>
