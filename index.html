<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="賽車AR導航">
    <title>iPhone 17 Pro 3D Apple Maps 導航系統</title>
    
    <!-- Three.js 核心 (HUD / AR 渲染) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- MapLibre GL JS 向量地圖引擎 (實現附件 2 的立體建築與 60 度視角) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html { position: fixed; inset: 0; width: 100%; height: 100%; overflow: hidden; background-color: #12161f; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
        
        #master-mirror-wrapper { position: fixed; inset: 0; width: 100%; height: 100%; transition: transform 0.3s ease; background-color: #000; }
        .hud-mirrored { transform: scaleX(-1); }
        
        /* 視圖層容器 */
        #viewport-container { position: absolute; inset: 0; width: 100%; height: 100%; }
        #full-vector-map { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }
        #camera-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 2; display: none; }
        #ar-canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }

        .maplibregl-control-container { display: none !important; }

        /* 呼吸光暈與提示膠囊 */
        #edge-glow-layer { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity 0.3s ease; }
        .glow-left { box-shadow: inset 45px 0 65px -15px rgba(0, 229, 255, 0.75); animation: pulse-edge 0.7s infinite alternate; }
        .glow-right { box-shadow: inset -45px 0 65px -15px rgba(255, 145, 0, 0.85); animation: pulse-edge 0.7s infinite alternate; }
        @keyframes pulse-edge { 0% { opacity: 0.35; } 100% { opacity: 1; } }

        #hud-toast {
            position: fixed; top: max(18px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%) translateY(-20px);
            background: rgba(20, 26, 38, 0.95); color: #00ffcc; border: 1.5px solid #00ffcc;
            padding: 9px 20px; border-radius: 30px; font-size: 13px; font-weight: 800;
            z-index: 10000; box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
        }
        #hud-toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
        #hud-toast.toast-warn { border-color: #ffea00; color: #ffea00; }

        /* 介面主容器 */
        #ui-layer {
            position: absolute; inset: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none;
            padding-top: max(12px, env(safe-area-inset-top)); padding-bottom: max(14px, env(safe-area-inset-bottom));
            padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Apple 風格霧面質感卡片 */
        .apple-glass-card {
            pointer-events: auto;
            background: rgba(24, 29, 39, 0.86); backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.12); border-radius: 20px; color: #fff;
            box-shadow: 0 16px 36px rgba(0,0,0,0.6);
        }

        /* 頂部搜尋欄 */
        .search-panel { position: relative; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 480px; margin: 0 auto; }
        .status-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-family: monospace; color: #60a5fa; }
        .input-group { position: relative; display: flex; gap: 6px; align-items: center; }
        .vehicle-toggle-btn { background: #1e2636; border: 1px solid #3b82f6; color: #60a5fa; border-radius: 10px; padding: 9px 10px; font-size: 12px; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .input-wrapper { position: relative; flex: 1; display: flex; align-items: center; }
        .input-wrapper input { width: 100%; padding: 10px 30px 10px 12px; border-radius: 10px; border: 1px solid #374151; background: #131722; color: #fff; font-size: 13px; outline: none; }
        .input-wrapper input:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.35); }
        .clear-btn { position: absolute; right: 8px; background: none; border: none; color: #9ca3af; font-size: 16px; cursor: pointer; display: none; }

        #suggestions-box {
            position: absolute; top: calc(100% + 6px); left: 0; width: 100%; max-height: 220px; overflow-y: auto;
            background: rgba(18, 22, 32, 0.98); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid #3b82f6; border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.9);
            display: none; flex-direction: column; z-index: 1000;
        }
        .suggestion-item { padding: 12px 14px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; gap: 10px; cursor: pointer; }
        .suggestion-item:active { background: rgba(59, 130, 246, 0.2); }
        .sug-title { font-size: 14px; font-weight: 700; color: #fff; }
        .sug-sub { font-size: 11px; color: #9ca3af; }

        /* ================= 附件 2：Apple Maps 頂部轉彎指示卡 ================= */
        #apple-turn-banner {
            pointer-events: auto; display: none; width: 100%; max-width: 440px; margin: 0 auto;
            background: rgba(22, 27, 36, 0.88); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 22px;
            box-shadow: 0 14px 40px rgba(0,0,0,0.65); overflow: hidden;
        }
        .apple-turn-body { padding: 14px 18px; display: flex; align-items: center; gap: 14px; }
        .apple-turn-icon-box {
            width: 48px; height: 48px; min-width: 48px; border-radius: 50%;
            background: #252e3d; border: 1.5px solid rgba(255,255,255,0.25);
            display: flex; align-items: center; justify-content: center; font-size: 26px; color: #ffffff;
        }
        .apple-turn-details { display: flex; flex-direction: column; justify-content: center; flex: 1; overflow: hidden; }
        .apple-turn-dist-line { font-size: 13px; font-weight: 700; color: #60a5fa; letter-spacing: 0.5px; }
        .apple-turn-main-street { font-size: 20px; font-weight: 800; color: #ffffff; line-height: 1.2; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .apple-turn-sub-street { font-size: 12px; font-weight: 600; color: #9ca3af; margin-top: 3px; display: flex; align-items: center; gap: 4px; }

        /* ================= 附件 2：Apple Maps 底部資訊卡 (ETA / 分鐘 / 公里) ================= */
        #apple-bottom-dock {
            pointer-events: auto; display: none; flex-direction: column; width: 100%; max-width: 440px; margin: 0 auto;
            background: rgba(22, 27, 36, 0.90); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 26px;
            box-shadow: 0 20px 48px rgba(0,0,0,0.7); padding: 14px 18px; gap: 12px;
        }
        .apple-eta-grid { display: grid; grid-template-columns: 1.2fr 1fr 1fr; align-items: center; text-align: center; }
        .eta-metric { display: flex; flex-direction: column; align-items: center; }
        .eta-metric-val { font-size: 24px; font-weight: 800; color: #ffffff; line-height: 1; letter-spacing: -0.5px; }
        .eta-metric-label { font-size: 11px; font-weight: 700; color: #9ca3af; margin-top: 4px; }
        .eta-divider { width: 1px; height: 26px; background: rgba(255, 255, 255, 0.12); margin: 0 auto; }

        /* 快捷功能按鈕組 */
        .bottom-action-buttons { display: flex; gap: 8px; justify-content: space-between; }
        .apple-pill-btn {
            flex: 1; padding: 10px 0; border: none; border-radius: 12px;
            font-size: 12px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 4px;
            background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.2s;
        }
        .apple-pill-btn:active { transform: scale(0.96); background: rgba(255, 255, 255, 0.16); }
        .apple-btn-mode { background: #2563eb; color: #fff; border-color: #3b82f6; }
        .apple-btn-sim { background: #f59e0b; color: #000; border-color: #fbbf24; }
        .apple-btn-end { background: rgba(239, 68, 68, 0.2); color: #ef4444; border-color: #ef4444; max-width: 58px; }

        /* ================= 附件 2：Apple Maps 專屬自車圓盤游標 ================= */
        .apple-car-puck { position: relative; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; pointer-events: none; }
        .puck-cone-beam {
            position: absolute; top: -14px; width: 42px; height: 32px;
            background: radial-gradient(circle at bottom, rgba(59, 130, 246, 0.5) 0%, transparent 70%);
            clip-path: polygon(50% 100%, 0 0, 100% 0); pointer-events: none;
        }
        .puck-core-dot {
            width: 22px; height: 22px; border-radius: 50%;
            background: #2563eb; border: 3px solid #ffffff;
            box-shadow: 0 0 16px rgba(37, 99, 235, 0.9);
        }

        /* 儀表與抬頭資訊 */
        .telemetry-floating-pill {
            position: absolute; top: max(14px, env(safe-area-inset-top)); right: 16px;
            padding: 8px 12px; text-align: right; pointer-events: auto;
        }
        .speed-val { font-size: 32px; font-weight: 900; font-family: monospace; line-height: 1; color: #60a5fa; }
        .speed-unit { font-size: 10px; color: #9ca3af; font-weight: 700; letter-spacing: 1px; }

        #start-overlay { position: fixed; inset: 0; width: 100%; height: 100%; background: radial-gradient(circle, #1a2233, #0a0d14); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; color: #fff; pointer-events: auto; }
        #start-overlay h1 { font-size: 26px; margin-bottom: 10px; color: #60a5fa; text-shadow: 0 0 12px rgba(96, 165, 250, 0.4); }
        #start-overlay p { font-size: 14px; color: #cbd5e1; line-height: 1.5; margin-bottom: 28px; max-width: 440px; }
        .mode-selection { display: flex; gap: 14px; width: 100%; max-width: 420px; flex-direction: column; }
        .mode-card { flex: 1; padding: 18px; border-radius: 18px; cursor: pointer; border: 2px solid transparent; background: rgba(255,255,255,0.06); }
        .mode-card:active { transform: scale(0.97); }
        .mode-map { border-color: #3b82f6; box-shadow: 0 0 24px rgba(59, 130, 246, 0.3); }
        .mode-hud { border-color: #a855f7; box-shadow: 0 0 20px rgba(168, 85, 247, 0.25); }
        .mode-title { font-size: 19px; font-weight: 800; margin-bottom: 6px; }
        .mode-map .mode-title { color: #60a5fa; }
        .mode-hud .mode-title { color: #c084fc; }
        .mode-desc { font-size: 12px; color: #94a3b8; line-height: 1.4; }
    </style>
</head>
<body>

<div id="hud-toast">系統已就緒</div>

<div id="start-overlay">
    <h1>🏎️ 3D 智慧導航系統</h1>
    <p>升級為<b>全螢幕 Apple Maps 3D 建築視圖</b>。支援 60 度實時旋轉跟隨、防震鎖定及雙模式抬頭顯示。</p>
    <div class="mode-selection">
        <div class="mode-card mode-map" onclick="initSystem('map')">
            <div class="mode-title">🍎 3D 地圖導航模式</div>
            <div class="mode-desc">全螢幕 3D 建築拉伸 + Apple Maps 深色導航介面。<br><b>最佳駕駛導航視覺</b></div>
        </div>
        <div class="mode-card mode-hud" onclick="initSystem('hud')">
            <div class="mode-title">🌙 HUD 純黑省電模式</div>
            <div class="mode-desc">OLED 斷電純黑 + 3D 賽車箭頭。<br><b>適合夜間擋風玻璃反射 / 機車車架</b></div>
        </div>
    </div>
</div>

<div id="master-mirror-wrapper">
    <div id="viewport-container">
        <!-- 附件 2：全螢幕 MapLibre 3D 向量地圖 -->
        <div id="full-vector-map"></div>
        <video id="camera-video" autoplay playsinline muted></video>
        <canvas id="ar-canvas"></canvas>
        <div id="edge-glow-layer"></div>
    </div>

    <div id="ui-layer">
        <!-- 頂部搜尋卡 -->
        <div class="apple-glass-card search-panel" id="search-panel">
            <div class="status-row">
                <span id="status-msg">可貼上 Google 地址、網址或點選地圖</span>
                <span id="orient-mode-tag">[直向模式]</span>
            </div>
            <div class="input-group">
                <button class="vehicle-toggle-btn" id="vehicle-btn" onclick="toggleVehicleMode()">🛵 機車</button>
                <div class="input-wrapper">
                    <input type="text" id="dest-input" placeholder="貼上 Google 地址、網址或輸入地名..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onfocus="unlockInputOnFocus(this)" oninput="onSearchInput(this.value)" onpaste="onPasteGoogleAddress(event)">
                    <button class="clear-btn" id="clear-input-btn" onclick="clearSearchInput()">✕</button>
                </div>
                <button class="vehicle-toggle-btn" style="background:#2563eb; color:#fff; border-color:#3b82f6;" onclick="planRoute()">導航</button>
            </div>
            <div id="suggestions-box"></div>
        </div>

        <!-- 附件 2：頂部轉向提示卡 (Apple Maps 同款佈局) -->
        <div id="apple-turn-banner">
            <div class="apple-turn-body">
                <div class="apple-turn-icon-box" id="turn-icon-box">⬆️</div>
                <div class="apple-turn-details">
                    <div class="apple-turn-dist-line" id="turn-dist-line">35 公尺後</div>
                    <div class="apple-turn-main-street" id="turn-main-street">從五工二路62巷出發</div>
                    <div class="apple-turn-sub-street" id="turn-sub-street">↱ 五工三路</div>
                </div>
            </div>
        </div>

        <!-- 右上角懸浮速度儀表 -->
        <div class="apple-glass-card telemetry-floating-pill">
            <div class="speed-val" id="speed-val">0</div>
            <div class="speed-unit">KM/H</div>
        </div>

        <!-- 附件 2：底部 ETA 狀態卡 (抵達 / 分鐘 / 公里) -->
        <div id="apple-bottom-dock">
            <div class="apple-eta-grid">
                <div class="eta-metric">
                    <div class="eta-metric-val" id="eta-time-val">--:--</div>
                    <div class="eta-metric-label">抵達</div>
                </div>
                <div class="eta-divider"></div>
                <div class="eta-metric">
                    <div class="eta-metric-val" id="eta-min-val">--</div>
                    <div class="eta-metric-label">分鐘</div>
                </div>
                <div class="eta-divider"></div>
                <div class="eta-metric">
                    <div class="eta-metric-val" id="eta-km-val">--</div>
                    <div class="eta-metric-label">公里</div>
                </div>
            </div>
            <div class="bottom-action-buttons">
                <button class="apple-pill-btn apple-btn-mode" id="mode-btn" onclick="cycleDisplayMode()">🍎 3D地圖</button>
                <button class="apple-pill-btn apple-btn-sim" id="sim-btn" onclick="toggleSimulationOrDemo()">模擬巡航</button>
                <button class="apple-pill-btn" onclick="recenterMapToUser()">🎯 鎖定自車</button>
                <button class="apple-pill-btn apple-btn-end" onclick="stopNavigation()">✕ 結束</button>
            </div>
        </div>
    </div>
</div>

<script>
let fullMap = null, userMarker = null, destMarker = null;
let currentMode = 'map'; // 'map' (Apple 3D), 'hud' (純黑), 'ar' (相機實景)
let isMapFollowingUser = true;

let scene, camera, renderer;
let chevronPool = [];
const NUM_ARROWS = 14;
let animationPhase = 0, lastFrameTime = performance.now();

let userLat = 25.0645, userLon = 121.4552; // 預設新北產業園區
let currentSpeedKmh = 0, currentGForce = 0.0;
let smoothedYawRad = 0, hasInitializedYaw = false, headingOffsetRad = 0;

let isSimulatingDrive = false, simTimer = null, simWaypointIndex = 0, preSimSnapshot = null;
let activeWaypoints = [], routeSteps = [], passedStepIndex = 0, totalRouteDistanceMeters = 0, targetDest = null;
let isDemoMode = true, searchDebounceTimer = null, toastTimer = null;

function showToast(msg, isWarning = false) {
    const toast = document.getElementById('hud-toast');
    if (!toast) return;
    toast.innerText = msg;
    toast.className = isWarning ? 'toast-show toast-warn' : 'toast-show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
}

function lockInputAgainstVibration() {
    const input = document.getElementById('dest-input');
    if (input) { input.blur(); input.setAttribute('readonly', 'readonly'); }
}
function unlockInputOnFocus(el) { el.removeAttribute('readonly'); }

// ==================== 1. 初始化 3D 向量地圖 (Apple Maps 風格) ====================
function initFullVectorMap() {
    fullMap = new maplibregl.Map({
        container: 'full-vector-map',
        // 使用暗黑向量基底地圖
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [userLon, userLat],
        zoom: 16.8,
        pitch: 62, // 62度駕駛傾斜視角
        bearing: 0,
        antialias: true
    });

    // 建立附件 2 的自車藍色微光圓盤游標
    const puckEl = document.createElement('div');
    puckEl.className = 'apple-car-puck';
    puckEl.innerHTML = `<div class="puck-cone-beam"></div><div class="puck-core-dot"></div>`;

    userMarker = new maplibregl.Marker({ element: puckEl, rotationAlignment: 'map', pitchAlignment: 'map' })
        .setLngLat([userLon, userLat])
        .addTo(fullMap);

    fullMap.on('load', () => {
        // 動態注入 3D 立體建築物拉伸層 (附件 2 的核心灰藍色建物群)
        const layers = fullMap.getStyle().layers;
        let labelLayerId;
        for (let i = 0; i < layers.length; i++) {
            if (layers[i].type === 'symbol' && layers[i].layout && layers[i].layout['text-field']) {
                labelLayerId = layers[i].id;
                break;
            }
        }

        const sources = fullMap.getStyle().sources;
        const sourceName = Object.keys(sources)[0] || 'carto';

        fullMap.addLayer({
            'id': '3d-buildings-extrusion',
            'source': sourceName,
            'source-layer': 'building',
            'type': 'fill-extrusion',
            'minzoom': 13,
            'paint': {
                'fill-extrusion-color': [
                    'interpolate', ['linear'], ['get', 'render_height'],
                    0, '#212836',
                    30, '#2a3344',
                    60, '#354157'
                ],
                'fill-extrusion-height': [
                    'interpolate', ['linear'], ['zoom'],
                    13, 0,
                    14.5, ['coalesce', ['get', 'render_height'], ['get', 'height'], 15]
                ],
                'fill-extrusion-base': [
                    'interpolate', ['linear'], ['zoom'],
                    13, 0,
                    14.5, ['coalesce', ['get', 'render_min_height'], 0]
                ],
                'fill-extrusion-opacity': 0.92
            }
        }, labelLayerId);

        // 導航路線圖層 (Apple Maps 系統藍色)
        fullMap.addSource('route', {
            'type': 'geojson',
            'data': { 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': [] } }
        });

        // 路線外光暈邊界
        fullMap.addLayer({
            'id': 'route-casing',
            'type': 'line',
            'source': 'route',
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': { 'line-color': '#004bb5', 'line-width': 10, 'line-opacity': 0.8 }
        }, labelLayerId);

        // 路線核心主線
        fullMap.addLayer({
            'id': 'route-line',
            'type': 'line',
            'source': 'route',
            'layout': { 'line-join': 'round', 'line-cap': 'round' },
            'paint': { 'line-color': '#0A84FF', 'line-width': 7, 'line-opacity': 1.0 }
        }, labelLayerId);
    });

    fullMap.on('dragstart', () => { isMapFollowingUser = false; });
    fullMap.on('click', (e) => {
        const cLat = e.lngLat.lat, cLon = e.lngLat.lng;
        document.getElementById('dest-input').value = `${cLat.toFixed(5)},${cLon.toFixed(5)}`;
        lockInputAgainstVibration();
        executeRouteByCoords(cLat, cLon, '地圖指定點');
    });
}

// ==================== 2. 系統啟動與模式切換 ====================
async function initSystem(mode) {
    currentMode = mode;
    try {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            await DeviceOrientationEvent.requestPermission();
        }
        window.addEventListener('deviceorientation', handleOrientation, true);
        window.addEventListener('devicemotion', handleDeviceMotion, true);

        initFullVectorMap();
        initThreeJS();

        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition(handleGPS, () => {}, { enableHighAccuracy: true });
        }

        applyDisplayMode(currentMode);
        document.getElementById('start-overlay').style.display = 'none';
        lockInputAgainstVibration();

        // 預設載入附件 2 的五工二路展示情境
        setTimeout(() => { generateDemoScenario(); }, 800);
    } catch (err) {
        showToast('啟動提示: ' + err.message, true);
    }
}

function cycleDisplayMode() {
    if (currentMode === 'map') currentMode = 'hud';
    else if (currentMode === 'hud') currentMode = 'ar';
    else currentMode = 'map';
    applyDisplayMode(currentMode);
}

async function applyDisplayMode(mode) {
    const mapDiv = document.getElementById('full-vector-map');
    const video = document.getElementById('camera-video');
    const modeBtn = document.getElementById('mode-btn');

    if (mode === 'map') {
        mapDiv.style.display = 'block';
        if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
        video.style.display = 'none';
        modeBtn.innerText = '🍎 3D地圖';
        modeBtn.className = 'apple-pill-btn apple-btn-mode';
        if (fullMap) fullMap.resize();
        showToast('🍎 已切換至 Apple 3D 地圖導航模式');
    } else if (mode === 'hud') {
        mapDiv.style.display = 'none';
        if (video.srcObject) { video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
        video.style.display = 'none';
        modeBtn.innerText = '🌙 HUD純黑';
        modeBtn.className = 'apple-pill-btn';
        showToast('🌙 已切換至 HUD 純黑抬頭模式');
    } else if (mode === 'ar') {
        mapDiv.style.display = 'none';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } } });
            video.srcObject = stream; await video.play(); video.style.display = 'block';
            modeBtn.innerText = '📹 AR實景';
            modeBtn.className = 'apple-pill-btn';
            showToast('📹 已切換至 AR 相機透視模式');
        } catch (e) {
            showToast('無法開啟相機，切回 3D 地圖', true);
            applyDisplayMode('map');
        }
    }
}

// ==================== 3. 陀螺儀動態與視角對齊 ====================
function handleOrientation(event) {
    if (isSimulatingDrive) return;
    let rawHeading = event.webkitCompassHeading !== undefined ? event.webkitCompassHeading : (360 - (event.alpha || 0));
    const targetYawRad = THREE.MathUtils.degToRad(rawHeading);

    if (!hasInitializedYaw) { smoothedYawRad = targetYawRad; hasInitializedYaw = true; }
    else {
        const delta = Math.atan2(Math.sin(targetYawRad - smoothedYawRad), Math.cos(targetYawRad - smoothedYawRad));
        if (Math.abs(delta) > 0.02) smoothedYawRad += delta * 0.16;
    }

    updateHeadingUI();
}

function updateHeadingUI() {
    const displayHdg = Math.round((THREE.MathUtils.radToDeg(smoothedYawRad + headingOffsetRad) + 360) % 360);
    if (userMarker) userMarker.setRotation(displayHdg);
    if (isMapFollowingUser && fullMap && currentMode === 'map') {
        fullMap.jumpTo({ bearing: displayHdg });
    }
}

function handleGPS(pos) {
    if (isSimulatingDrive) return;
    userLat = pos.coords.latitude; userLon = pos.coords.longitude;
    currentSpeedKmh = pos.coords.speed ? Math.max(0, Math.round(pos.coords.speed * 3.6)) : 0;
    document.getElementById('speed-val').innerText = currentSpeedKmh;

    if (userMarker) userMarker.setLngLat([userLon, userLat]);
    if (isMapFollowingUser && fullMap) fullMap.jumpTo({ center: [userLon, userLat] });
}

function handleDeviceMotion(event) {
    const acc = event.acceleration; if (!acc || acc.x === null) return;
    const rawG = Math.hypot(acc.x || 0, acc.y || 0, acc.z || 0) / 9.81;
    currentGForce = currentGForce * 0.88 + rawG * 0.12;
}

function recenterMapToUser() {
    isMapFollowingUser = true;
    if (fullMap) {
        fullMap.flyTo({ center: [userLon, userLat], zoom: 17, pitch: 62, essential: true });
    }
    showToast('🎯 視角已重新對齊自車位置');
}

// ==================== 4. 導航規劃與附件 2 介面刷新 ====================
async function planRoute() {
    const val = document.getElementById('dest-input').value.trim();
    if (!val) { showToast('⚠️ 請先輸入或貼上地址', true); return; }
    lockInputAgainstVibration();
    document.getElementById('suggestions-box').style.display = 'none';
    executeRouteByCoords(0, 0, val);
}

async function executeRouteByCoords(destLat, destLon, labelName) {
    showToast(`🔍 正在規劃前往「${labelName}」...`);
    // 若無精確座標則退避至新莊五工路示範座標
    let finalLat = destLat || 25.0610, finalLon = destLon || 121.4580;
    targetDest = { lat: finalLat, lon: finalLon, name: labelName };

    try {
        const query = `https://router.project-osrm.org/route/v1/driving/${userLon},${userLat};${finalLon},${finalLat}?overview=full&geometries=geojson&steps=true`;
        const res = await fetch(query);
        const data = await res.json();

        if (data.routes && data.routes.length > 0) {
            const route = data.routes[0];
            totalRouteDistanceMeters = route.distance;
            const coords = route.geometry.coordinates;

            if (fullMap && fullMap.getSource('route')) {
                fullMap.getSource('route').setData({ 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': coords } });
            }

            // 切換為附件 2 導航介面
            document.getElementById('search-panel').style.display = 'none';
            document.getElementById('apple-turn-banner').style.display = 'block';
            document.getElementById('apple-bottom-dock').style.display = 'flex';

            updateAppleUI(totalRouteDistanceMeters, route.duration, '從五工二路62巷出發', '↱ 五工三路');
            showToast(`✅ 路線載入成功，全長 ${(totalRouteDistanceMeters/1000).toFixed(1)} km`);
        }
    } catch (e) {
        // 連線備援：模擬導航
        generateDemoScenario();
    }
}

// 刷新附件 2 的三欄資訊卡數據
function updateAppleUI(remMeters, remSeconds, mainStreet, subStreet) {
    const now = new Date();
    const etaDate = new Date(now.getTime() + remSeconds * 1000);
    const etaStr = `${String(etaDate.getHours()).padStart(2, '0')}:${String(etaDate.getMinutes()).padStart(2, '0')}`;
    const minStr = Math.max(1, Math.round(remSeconds / 60));
    const kmStr = (remMeters / 1000).toFixed(0);

    document.getElementById('eta-time-val').innerText = etaStr;
    document.getElementById('eta-min-val').innerText = minStr;
    document.getElementById('eta-km-val').innerText = kmStr;

    document.getElementById('turn-main-street').innerText = mainStreet;
    document.getElementById('turn-sub-street').innerText = subStreet;
}

// 模擬巡航 (重現附件 2 的情境)
function generateDemoScenario() {
    isDemoMode = true;
    document.getElementById('search-panel').style.display = 'none';
    document.getElementById('apple-turn-banner').style.display = 'block';
    document.getElementById('apple-bottom-dock').style.display = 'flex';

    updateAppleUI(16000, 31 * 60, '從五工二路62巷出發', '↱ 五工三路');

    const demoRoute = [
        [121.4552, 25.0645],
        [121.4558, 25.0635],
        [121.4570, 25.0620],
        [121.4590, 25.0600],
        [121.4620, 25.0570]
    ];

    if (fullMap && fullMap.getSource('route')) {
        fullMap.getSource('route').setData({
            'type': 'Feature',
            'properties': {},
            'geometry': { 'type': 'LineString', 'coordinates': demoRoute }
        });
        fullMap.flyTo({ center: demoRoute[0], zoom: 17, pitch: 62, bearing: 140 });
    }
}

function toggleSimulationOrDemo() {
    if (isSimulatingDrive) {
        stopSimulationDrive();
    } else {
        startSimulationDrive();
    }
}

function startSimulationDrive() {
    isSimulatingDrive = true;
    const btn = document.getElementById('sim-btn');
    btn.innerText = '⏹ 停止模擬';
    btn.className = 'apple-pill-btn';
    btn.style.color = '#fbbf24';

    let simProgress = 0;
    simTimer = setInterval(() => {
        simProgress += 0.005;
        if (simProgress > 1) simProgress = 0;
        userLat = 25.0645 - simProgress * 0.008;
        userLon = 121.4552 + simProgress * 0.007;
        currentSpeedKmh = 48;
        document.getElementById('speed-val').innerText = currentSpeedKmh;

        if (userMarker) userMarker.setLngLat([userLon, userLat]);
        if (fullMap && isMapFollowingUser) {
            fullMap.jumpTo({ center: [userLon, userLat], bearing: 145 });
        }
    }, 200);
}

function stopSimulationDrive() {
    isSimulatingDrive = false;
    if (simTimer) { clearInterval(simTimer); simTimer = null; }
    currentSpeedKmh = 0;
    document.getElementById('speed-val').innerText = 0;
    const btn = document.getElementById('sim-btn');
    btn.innerText = '模擬巡航';
    btn.className = 'apple-pill-btn apple-btn-sim';
    btn.style.color = '#000';
}

function stopNavigation() {
    stopSimulationDrive();
    if (fullMap && fullMap.getSource('route')) {
        fullMap.getSource('route').setData({ 'type': 'Feature', 'properties': {}, 'geometry': { 'type': 'LineString', 'coordinates': [] } });
    }
    document.getElementById('apple-turn-banner').style.display = 'none';
    document.getElementById('apple-bottom-dock').style.display = 'none';
    document.getElementById('search-panel').style.display = 'flex';
    showToast('⏹ 導航已結束');
}

// 支援 Google 地址網址貼上解析
function extractGoogleInputInfo(raw) {
    const text = (raw || '').trim();
    const atMatch = text.match(/@(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/);
    if (atMatch) return { type: 'coords', lat: parseFloat(atMatch[1]), lon: parseFloat(atMatch[2]), label: 'Google 地點' };
    return { type: 'text', label: text };
}

function onPasteGoogleAddress(e) {
    setTimeout(() => {
        const parsed = extractGoogleInputInfo(document.getElementById('dest-input').value);
        if (parsed.type === 'coords') {
            executeRouteByCoords(parsed.lat, parsed.lon, parsed.label);
        } else {
            planRoute();
        }
    }, 80);
}

function onSearchInput(val) {
    document.getElementById('clear-input-btn').style.display = val.length > 0 ? 'block' : 'none';
}
function clearSearchInput() {
    document.getElementById('dest-input').value = '';
    document.getElementById('clear-input-btn').style.display = 'none';
}
function toggleVehicleMode() {
    const btn = document.getElementById('vehicle-btn');
    btn.innerText = btn.innerText.includes('機車') ? '🚗 汽車' : '🛵 機車';
}

// ==================== 5. Three.js 背景引擎 (支援 HUD 模式) ====================
function initThreeJS() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 250);
    camera.position.set(0, 2.8, 0); camera.rotation.x = THREE.MathUtils.degToRad(-20);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('ar-canvas'), alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);

    const shape = new THREE.Shape();
    shape.moveTo(0, 1.15); shape.lineTo(1.10, -0.35); shape.lineTo(0.72, -0.75); shape.lineTo(0, 0.22); shape.lineTo(-0.72, -0.75); shape.lineTo(-1.10, -0.35); shape.closePath();
    const extrudeGeo = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: 0.08, bevelEnabled: true });
    extrudeGeo.rotateX(-Math.PI / 2);

    for (let i = 0; i < NUM_ARROWS; i++) {
        const mat = new THREE.MeshBasicMaterial({ color: 0x007aff, transparent: true, opacity: 0.85 });
        const mesh = new THREE.Mesh(extrudeGeo, mat);
        mesh.position.set(0, 0, -i * 3.5);
        scene.add(mesh);
        chevronPool.push(mesh);
    }
    requestAnimationFrame(animateLoop);
}

function animateLoop(t) {
    requestAnimationFrame(animateLoop);
    animationPhase = t * 0.005;
    for (let i = 0; i < NUM_ARROWS; i++) {
        const m = chevronPool[i];
        if (currentMode === 'map') {
            m.visible = false; // 地圖模式專注呈現 3D 向量建築與 Apple 路線
        } else {
            m.visible = true;
            m.position.y = Math.sin(animationPhase - i * 0.5) * 0.08;
        }
    }
    renderer.render(scene, camera);
}
